name: Spring Boot CI/CD Pipeline

on:
  push:
    branches: [ "devonly" ]
  pull_request:
    branches: [ "devonly" ]

permissions:
  contents: read
  packages: write  # CRITICAL: Allows pushing to GitHub Packages and GHCR

jobs:
  # --- STAGE 1: TEST, VERIFY & QUALITY SCAN ---
  test-and-verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code (Full Git History for Sonar)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Cache SonarCloud packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Run Tests and Sonar Analysis
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn clean verify sonar:sonar \
            -Dsonar.projectKey=luckyacode_appthree \
            -Dsonar.organization=luckyacode \
            -Dsonar.host.url=https://sonarcloud.io

  # --- STAGE 2: BUILD & PUSH ARTIFACTS (JAR & DOCKER IMAGE) ---
  build-and-ship:
    needs: test-and-verify
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/devonly' && github.event_name == 'push'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      # --- STEP A: PUBLISH THE JAR PACKAGE ---
      - name: Generate Dynamic Maven Settings for Authentication
        run: |
          mkdir -p .github/workflows
          cat <<EOF > .github/workflows/settings.xml
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0 http://maven.apache.org/xsd/settings-1.0.0.xsd">
              <servers>
                  <server>
                      <id>github</id>
                      <username>\${env.GITHUB_ACTOR}</username>
                      <password>\${env.GITHUB_TOKEN}</password>
                  </server>
              </servers>
          </settings>
          EOF

      - name: Publish JAR to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mvn -B clean deploy \
            -Dmaven.test.skip=true \
            --settings .github/workflows/settings.xml

      # --- STEP B: PUBLISH DOCKER IMAGE TO GHCR.IO ---
      - name: Log in to GitHub Container Registry (ghcr.io)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Downcase Repository Name for Docker Tagging Compliance
        run: |
          echo "IMAGE_NAME=$(echo 'ghcr.io/${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Extract Metadata (Tagging)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}